<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F6F0E8;color:#3B2418;font-family:'Zen Maru Gothic',sans-serif;overflow:hidden">

  <div style="padding:52px 12px 10px;display:flex;align-items:center;gap:4px">
    <a href="Main.html" aria-label="戻る" style="width:44px;height:44px;display:grid;place-items:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin:0;font-size:22px;font-weight:700">設定</h1>
  </div>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;color:#7A6455;padding-left:4px">写真からの自動入力</div>
      <div style="background:#FFFFFF;border-radius:18px;padding:4px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">自動入力を使う</span>
          <div role="img" aria-label="オン" style="width:48px;height:28px;border-radius:14px;background:#A4521F;position:relative"><div style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF"></div></div>
        </div>
        <div style="height:1px;background:#EADFD1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">味の評価も推定して入れる</span>
          <div role="img" aria-label="オン" style="width:48px;height:28px;border-radius:14px;background:#A4521F;position:relative"><div style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF"></div></div>
        </div>
      </div>
      <div style="font-size:12px;line-height:1.6;color:#7A6455;padding:0 4px">豆を判別するため、写真を外部のAIサービスに送信します。オフにすると写真は端末内だけで使われます。</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;color:#7A6455;padding-left:4px">表示</div>
      <div style="background:#FFFFFF;border-radius:18px;padding:4px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">テーマ</span>
          <span style="font-size:14px;color:#7A6455">自動(端末に合わせる)</span>
        </div>
        <div style="height:1px;background:#EADFD1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">起動時に開く画面</span>
          <span style="font-size:14px;color:#7A6455">豆</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;color:#7A6455;padding-left:4px">データ</div>
      <div style="background:#FFFFFF;border-radius:18px;padding:4px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">バックアップを書き出す</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6455" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </div>
        <div style="height:1px;background:#EADFD1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">バックアップから復元</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6455" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </div>
        <div style="height:1px;background:#EADFD1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px;color:#B3321F">すべてのデータを削除</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6455" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;color:#7A6455;padding-left:4px">このアプリについて</div>
      <div style="background:#FFFFFF;border-radius:18px;padding:4px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">バージョン</span>
          <span style="font-size:14px;color:#7A6455">1.0.0</span>
        </div>
        <div style="height:1px;background:#EADFD1"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
          <span style="font-size:15px">プライバシーについて</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6455" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
