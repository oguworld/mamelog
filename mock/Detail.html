<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>豆の詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F6F0E8;color:#3B2418;font-family:'Zen Maru Gothic',sans-serif;overflow:hidden">

  <div style="height:220px;background:linear-gradient(160deg,#C98B5A,#6B3B1F);position:relative;display:grid;place-items:center">
    <svg width="96" height="96" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="24" rx="12" ry="18" transform="rotate(35 24 24)" fill="#F6F0E8" fill-opacity="0.92"/><path d="M19 11c9 6-7 14 2 25" transform="rotate(35 24 24)" stroke="#8A5230" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <a href="Main.html" aria-label="戻る" style="position:absolute;left:16px;top:52px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);display:grid;place-items:center;color:#3B2418">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <button aria-label="豆の情報を編集" style="position:absolute;right:16px;top:52px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);display:grid;place-items:center;color:#3B2418;border:0;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
    </button>
  </div>

  <div style="position:absolute;top:190px;left:0;right:0;bottom:0;background:#F6F0E8;border-radius:28px 28px 0 0;padding:22px 20px 0;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <h1 style="margin:0;font-size:22px;font-weight:700">イルガチェフェ G1</h1>
        <div style="font-size:12.5px;color:#7A6455">エチオピア ・ 浅煎り ・ ナチュラル ・ Kopi Atelier</div>
      </div>
      <div style="display:flex;align-items:center;gap:3px;color:#A4521F;font-size:15px;font-weight:700;flex:none;padding-top:2px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#A4521F" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></svg>4.0
      </div>
    </div>

    <div style="display:flex;gap:6px">
      <span style="background:#EADFD1;font-size:12px;padding:6px 10px;border-radius:999px">酸味 4</span>
      <span style="background:#EADFD1;font-size:12px;padding:6px 10px;border-radius:999px">苦味 2</span>
      <span style="background:#EADFD1;font-size:12px;padding:6px 10px;border-radius:999px">甘味 3</span>
      <span style="background:#EADFD1;font-size:12px;padding:6px 10px;border-radius:999px">コク 2</span>
      <span style="background:#EADFD1;font-size:12px;padding:6px 10px;border-radius:999px">香り 5</span>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:4px">
      <h2 style="margin:0;font-size:15px;font-weight:700">この豆の日々</h2>
      <span style="font-size:12px;color:#7A6455">購入 11/08 ・ 7 件</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:0;position:relative">
      <div style="position:absolute;left:5px;top:10px;bottom:0;width:2px;background:#EADFD1"></div>

      <div style="display:flex;gap:14px;padding-bottom:16px">
        <div style="width:12px;height:12px;border-radius:50%;background:#A4521F;margin-top:4px;flex:none;position:relative"></div>
        <div style="display:flex;gap:10px;min-width:0;flex:1">
          <div style="flex:1;min-width:0">
            <div style="font-size:11.5px;color:#7A6455">今日 8:10</div>
            <div style="font-size:14px;line-height:1.6;margin-top:2px">朝のベランダで一杯。冷めてきたら桃みたいな甘さが出てきた。</div>
          </div>
          <div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(145deg,#D9A66E,#8A5230);flex:none;display:grid;place-items:center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F6F0E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:14px;padding-bottom:16px">
        <div style="width:12px;height:12px;border-radius:50%;background:#C9B5A2;margin-top:4px;flex:none"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:11.5px;color:#7A6455">11/20(木) 22:40</div>
          <div style="font-size:14px;line-height:1.6;margin-top:2px">仕事終わりに。湯温を下げたら酸味がまるくなった。</div>
        </div>
      </div>

      <div style="display:flex;gap:14px;padding-bottom:16px">
        <div style="width:12px;height:12px;border-radius:50%;background:#C9B5A2;margin-top:4px;flex:none"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:11.5px;color:#7A6455">11/16(日) 15:00</div>
          <div style="font-size:14px;line-height:1.6;margin-top:2px">友だちと半分こ。「花みたい」と言われた。</div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:12px;right:12px;bottom:122px;height:56px;box-sizing:border-box;background:#FFFFFF;border-radius:28px;box-shadow:0 6px 20px rgba(59,36,24,0.16);display:flex;align-items:center;gap:6px;padding:0 8px">
    <button aria-label="写真を添える" style="width:44px;height:44px;border-radius:50%;border:0;background:#F6F0E8;color:#3B2418;display:grid;place-items:center;cursor:pointer;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <span style="flex:1;font-size:14px;color:#7A6455;padding-left:4px">気づいたことをひとこと…</span>
    <button aria-label="記録する" style="width:44px;height:44px;border-radius:50%;border:0;background:#A4521F;color:#FFFFFF;display:grid;place-items:center;cursor:pointer;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14-7-5 14-2-6z"/></svg>
    </button>
  </div>

  <nav aria-label="メインメニュー" style="position:absolute;left:0;right:0;bottom:0;height:92px;box-sizing:border-box;padding:10px 28px 26px;background:#FFFFFF;border-top:1px solid #EADFD1;display:flex;align-items:flex-start;justify-content:space-between">
    <a href="Main.html" style="width:96px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#A4521F">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span style="font-size:11.5px;font-weight:700">豆</span>
    </a>
    <a href="Add.html" aria-label="豆を追加" style="width:60px;height:60px;margin-top:-26px;border-radius:50%;background:#A4521F;color:#FFFFFF;display:grid;place-items:center;box-shadow:0 6px 16px rgba(59,36,24,0.28);border:4px solid #F6F0E8;box-sizing:border-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="Days.html" style="width:96px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7A6455">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v15H8a2 2 0 0 1-2-2zM6 18a2 2 0 0 1 2-2h11M10 8h5"/></svg>
      <span style="font-size:11.5px;font-weight:500">日々</span>
    </a>
  </nav>
</div>
</body></html>
