<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>日々</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F6F0E8;color:#3B2418;font-family:'Zen Maru Gothic',sans-serif;overflow:hidden">

  <div style="padding:56px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <h1 style="margin:0;font-size:26px;font-weight:700;letter-spacing:0.02em">日々</h1>
      <div style="font-size:13px;color:#7A6455;margin-top:4px">豆と過ごした毎日のひとこと</div>
    </div>
    <a href="Settings.html" aria-label="設定" style="width:44px;height:44px;margin:-8px -10px -8px 0;display:grid;place-items:center;color:#3B2418"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:16px">

    <div style="background:#FFFFFF;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:6px;align-self:flex-start;background:#EADFD1;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500">
        <svg width="14" height="14" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="24" rx="12" ry="18" transform="rotate(35 24 24)" fill="#A4521F"/></svg>
        イルガチェフェ G1
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A6455" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="flex:1;font-size:15px;color:#7A6455;min-height:44px;display:flex;align-items:center">今日の一杯、どうだった?</span>
        <button aria-label="写真を添える" style="width:44px;height:44px;border-radius:50%;border:0;background:#F6F0E8;color:#3B2418;display:grid;place-items:center;cursor:pointer;flex:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button aria-label="記録する" style="width:44px;height:44px;border-radius:50%;border:0;background:#A4521F;color:#FFFFFF;display:grid;place-items:center;cursor:pointer;flex:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14-7-5 14-2-6z"/></svg>
        </button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12.5px;font-weight:700;color:#7A6455">今日</div>

      <a href="Detail.html" style="display:flex;gap:12px;background:#FFFFFF;border-radius:18px;padding:12px">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#7A6455"><svg width="12" height="12" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="24" rx="12" ry="18" transform="rotate(35 24 24)" fill="#A4521F"/></svg>イルガチェフェ G1 ・ 8:10</div>
          <div style="font-size:14px;line-height:1.6">朝のベランダで一杯。冷めてきたら桃みたいな甘さが出てきた。</div>
        </div>
        <div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(145deg,#D9A66E,#8A5230);flex:none"></div>
      </a>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12.5px;font-weight:700;color:#7A6455">昨日</div>

      <div style="display:flex;flex-direction:column;gap:4px;background:#FFFFFF;border-radius:18px;padding:12px">
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#7A6455"><svg width="12" height="12" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="24" rx="12" ry="18" transform="rotate(35 24 24)" fill="#3B2418"/></svg>ブラジル セラード ・ 21:30</div>
        <div style="font-size:14px;line-height:1.6">ミルクを入れたらチョコみたいになった。夜はこっちが落ち着く。</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:4px;background:#FFFFFF;border-radius:18px;padding:12px">
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#7A6455"><svg width="12" height="12" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="24" rx="12" ry="18" transform="rotate(35 24 24)" fill="#A4521F"/></svg>イルガチェフェ G1 ・ 22:40</div>
        <div style="font-size:14px;line-height:1.6">仕事終わりに。湯温を下げたら酸味がまるくなった。</div>
      </div>
    </div>

  </div>

  <nav aria-label="メインメニュー" style="position:absolute;left:0;right:0;bottom:0;height:92px;box-sizing:border-box;padding:10px 28px 26px;background:#FFFFFF;border-top:1px solid #EADFD1;display:flex;align-items:flex-start;justify-content:space-between">
    <a href="Main.html" style="width:96px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7A6455">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span style="font-size:11.5px;font-weight:500">豆</span>
    </a>
    <a href="Add.html" aria-label="豆を追加" style="width:60px;height:60px;margin-top:-26px;border-radius:50%;background:#A4521F;color:#FFFFFF;display:grid;place-items:center;box-shadow:0 6px 16px rgba(59,36,24,0.28);border:4px solid #F6F0E8;box-sizing:border-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="Days.html" style="width:96px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#A4521F">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v15H8a2 2 0 0 1-2-2zM6 18a2 2 0 0 1 2-2h11M10 8h5"/></svg>
      <span style="font-size:11.5px;font-weight:700">日々</span>
    </a>
  </nav>
</div>
</body></html>
