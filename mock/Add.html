<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>豆を追加</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#F6F0E8;color:#3B2418;font-family:'Zen Maru Gothic',sans-serif;overflow:hidden">

  <div style="padding:56px 20px 10px;display:flex;align-items:center;justify-content:space-between">
    <a href="Main.html" style="min-height:44px;display:flex;align-items:center;font-size:15px;color:#7A6455">キャンセル</a>
    <h1 style="margin:0;font-size:17px;font-weight:700">豆を追加</h1>
    <a href="Main.html" style="min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:700;color:#A4521F">保存</a>
  </div>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;gap:12px;align-items:stretch">
      <div style="width:116px;height:116px;border-radius:20px;background:linear-gradient(145deg,#C98B5A,#6B3B1F);display:grid;place-items:center;flex:none;position:relative">
        <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="24" rx="12" ry="18" transform="rotate(35 24 24)" fill="#F6F0E8" fill-opacity="0.92"/><path d="M19 11c9 6-7 14 2 25" transform="rotate(35 24 24)" stroke="#8A5230" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
        <button aria-label="写真を撮り直す" style="position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:#FFFFFF;border:0;display:grid;place-items:center;color:#3B2418;box-shadow:0 2px 8px rgba(59,36,24,0.2);cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
      </div>
      <div style="flex:1;background:#FFFFFF;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px;border:1.5px solid #A4521F">
        <div style="display:flex;align-items:center;gap:6px;color:#A4521F;font-size:13px;font-weight:700">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
          自動入力しました
        </div>
        <div style="font-size:12.5px;color:#7A6455;line-height:1.5">写真から特定し、公式情報を参照。内容を確認して保存してください。</div>
        <div style="font-size:11.5px;color:#7A6455">確度: 高</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label style="font-size:12px;color:#7A6455">豆の名前</label>
      <div style="background:#FFFFFF;border-radius:14px;padding:0 14px;height:46px;display:flex;align-items:center;font-size:15px">イルガチェフェ G1</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:12px;color:#7A6455">お店</label>
        <div style="background:#FFFFFF;border-radius:14px;padding:0 14px;height:46px;display:flex;align-items:center;font-size:15px">Kopi Atelier</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:12px;color:#7A6455">産地</label>
        <div style="background:#FFFFFF;border-radius:14px;padding:0 14px;height:46px;display:flex;align-items:center;font-size:15px">エチオピア</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label style="font-size:12px;color:#7A6455">焙煎度</label>
      <div style="display:flex;gap:6px">
        <span style="flex:1;text-align:center;background:#A4521F;color:#FFFFFF;font-size:12.5px;font-weight:700;padding:11px 0;border-radius:12px">浅</span>
        <span style="flex:1;text-align:center;background:#EADFD1;font-size:12.5px;padding:11px 0;border-radius:12px">中浅</span>
        <span style="flex:1;text-align:center;background:#EADFD1;font-size:12.5px;padding:11px 0;border-radius:12px">中</span>
        <span style="flex:1;text-align:center;background:#EADFD1;font-size:12.5px;padding:11px 0;border-radius:12px">中深</span>
        <span style="flex:1;text-align:center;background:#EADFD1;font-size:12.5px;padding:11px 0;border-radius:12px">深</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label style="font-size:12px;color:#7A6455">精製方法</label>
      <div style="display:flex;gap:6px">
        <span style="flex:1;text-align:center;background:#EADFD1;font-size:12.5px;padding:11px 0;border-radius:12px">ウォッシュド</span>
        <span style="flex:1;text-align:center;background:#A4521F;color:#FFFFFF;font-size:12.5px;font-weight:700;padding:11px 0;border-radius:12px">ナチュラル</span>
        <span style="flex:1;text-align:center;background:#EADFD1;font-size:12.5px;padding:11px 0;border-radius:12px">ハニー</span>
      </div>
    </div>

    <div style="background:#FFFFFF;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:12px;color:#7A6455">味の評価(公式情報から推定)</span><span style="font-size:11.5px;color:#7A6455">あとで調整できます</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;font-size:13.5px">酸味</span><div style="flex:1;height:6px;border-radius:3px;background:#EADFD1;position:relative"><div style="width:80%;height:100%;border-radius:3px;background:#A4521F"></div><div style="position:absolute;left:80%;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFFFFF;border:2px solid #A4521F;box-sizing:border-box"></div></div></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;font-size:13.5px">苦味</span><div style="flex:1;height:6px;border-radius:3px;background:#EADFD1;position:relative"><div style="width:40%;height:100%;border-radius:3px;background:#A4521F"></div><div style="position:absolute;left:40%;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFFFFF;border:2px solid #A4521F;box-sizing:border-box"></div></div></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;font-size:13.5px">甘味</span><div style="flex:1;height:6px;border-radius:3px;background:#EADFD1;position:relative"><div style="width:60%;height:100%;border-radius:3px;background:#A4521F"></div><div style="position:absolute;left:60%;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFFFFF;border:2px solid #A4521F;box-sizing:border-box"></div></div></div>
    </div>
  </div>

  <nav aria-label="メインメニュー" style="position:absolute;left:0;right:0;bottom:0;height:92px;box-sizing:border-box;padding:10px 28px 26px;background:#FFFFFF;border-top:1px solid #EADFD1;display:flex;align-items:flex-start;justify-content:space-between">
    <a href="Main.html" style="width:96px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7A6455">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      <span style="font-size:11.5px;font-weight:500">豆</span>
    </a>
    <a href="Add.html" aria-label="豆を追加" style="width:60px;height:60px;margin-top:-26px;border-radius:50%;background:#3B2418;color:#FFFFFF;display:grid;place-items:center;box-shadow:0 6px 16px rgba(59,36,24,0.28);border:4px solid #F6F0E8;box-sizing:border-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="Days.html" style="width:96px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7A6455">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v15H8a2 2 0 0 1-2-2zM6 18a2 2 0 0 1 2-2h11M10 8h5"/></svg>
      <span style="font-size:11.5px;font-weight:500">日々</span>
    </a>
  </nav>
</div>
</body></html>
